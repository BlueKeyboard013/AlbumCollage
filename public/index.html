<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Album Collage</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Spotify Album Collage</h1>
        <div class="actions">
          <button id="login">Login with Spotify</button>
          <button id="logout" hidden>Logout</button>
          <button id="refresh">Refresh Collage</button>
          <button id="scratch">Start from Scratch</button>
          <button id="download">Download Collage</button>
        </div>
      </header>

      <div class="controls">
        <div class="preset-group">
          <span class="preset-label">Poster size</span>
          <div class="preset-buttons">
            <button data-frame="poster:11x17">11 x 17</button>
            <button data-frame="poster:16x20">16 x 20</button>
            <button data-frame="poster:18x24">18 x 24</button>
            <button data-frame="poster:24x36">24 x 36</button>
          </div>
        </div>

        <div class="preset-group">
          <span class="preset-label">Shape</span>
          <div class="preset-buttons">
            <button data-frame="shape:square">Square</button>
            <button data-frame="shape:circle">Circle</button>
            <button data-frame="shape:heart">Heart</button>
            <button data-frame="shape:triangle">Triangle</button>
          </div>
        </div>
      </div>

      <div class="search-bar">
        <input type="text" id="song-search" placeholder="Search for a song to add...">
        <button id="search-btn">Search</button>
      </div>
      <div id="search-results" class="search-results" hidden></div>

      <main>
        <div id="collage" class="collage"></div>
      </main>

      <footer>
        <p>Uses Spotify's <a href="https://developer.spotify.com/" target="_blank">Web API</a>. You must register an app and set redirect URI to <code>http://127.0.0.1:8888/callback</code>.</p>
        <p>Drag a cover to reposition it, drag a search result onto the collage to add it, and hover a cover to reveal its remove (&times;) button.</p>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
