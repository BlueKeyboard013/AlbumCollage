<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Album Collage</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Spotify Album Collage</h1>
        <div class="actions">
          <button id="login">Login with Spotify</button>
          <button id="logout" hidden>Logout</button>
          <button id="refresh">Refresh Collage</button>
          <button id="download">Download Collage</button>
        </div>
      </header>

      <div class="controls">
        <label>
          Shape
          <select id="shape">
            <option value="square">Square</option>
            <option value="rectangle">Rectangle</option>
          </select>
        </label>

        <label id="square-size-label">
          Grid size
          <select id="square-size">
            <option value="3">3 x 3</option>
            <option value="4" selected>4 x 4</option>
            <option value="5">5 x 5</option>
            <option value="6">6 x 6</option>
            <option value="8">8 x 8</option>
            <option value="10">10 x 10</option>
          </select>
        </label>

        <label id="rect-cols-label" hidden>
          Columns
          <select id="rect-cols">
            <option value="3">3</option>
            <option value="4" selected>4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="8">8</option>
          </select>
        </label>

        <label id="rect-rows-label" hidden>
          Rows
          <select id="rect-rows">
            <option value="2">2</option>
            <option value="3" selected>3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
          </select>
        </label>

        <label>
          Size
          <input type="range" id="tile-size" min="60" max="220" step="10" value="120">
        </label>
      </div>

      <main>
        <div id="collage" class="collage"></div>
      </main>

      <footer>
        <p>Uses Spotify's <a href="https://developer.spotify.com/" target="_blank">Web API</a>. You must register an app and set redirect URI to <code>http://127.0.0.1:8888/callback</code>.</p>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
